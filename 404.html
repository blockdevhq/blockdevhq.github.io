<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#07110f">
  <title>Page not found | BlockDev</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .not-found { min-height: 100svh; display: grid; place-items: center; padding: 32px; text-align: center; }
    .not-found-inner { max-width: 680px; }
    .not-found-code { margin: 0 0 12px; color: var(--accent); font: 700 clamp(72px, 18vw, 150px)/1 var(--font-mono); letter-spacing: -.08em; }
    .not-found h1 { margin-bottom: 18px; font-size: clamp(34px, 7vw, 56px); }
    .not-found p { margin: 0 auto 30px; max-width: 540px; color: var(--muted); font-size: 18px; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <p class="not-found-code" aria-hidden="true">404</p>
      <h1>This route has no consensus.</h1>
      <p>The requested page is not part of this site. Return to the canonical starting point.</p>
      <a class="button button-primary" href="./">Back to the homepage</a>
    </div>
  </main>
</body>
</html>
